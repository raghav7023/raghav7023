<svg width="1000" height="230" viewBox="0 0 1000 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="holoBg" x1="0" y1="0" x2="1000" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0914" />
      <stop offset="50%" stop-color="#151126" />
      <stop offset="100%" stop-color="#0C1424" />
    </linearGradient>
    <linearGradient id="holoStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="33%" stop-color="#E879F9" />
      <stop offset="66%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="holoGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="holoClip">
      <rect x="4" y="4" width="992" height="222" rx="22" />
    </clipPath>
  </defs>

  <g clip-path="url(#holoClip)">
    <rect x="4" y="4" width="992" height="222" rx="22" fill="url(#holoBg)" />

    <!-- Diagonal Holographic Foil Shimmer -->
    <polygon points="-300,0 -120,0 -240,230 -420,230" fill="url(#shimmer)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 1500,0" dur="5s" repeatCount="indefinite" />
    </polygon>
  </g>

  <rect x="4" y="4" width="992" height="222" rx="22" fill="none" stroke="url(#holoStroke)" stroke-width="3" />

  <!-- Top Pill -->
  <rect x="405" y="25" width="190" height="26" rx="13" fill="#1C1633" stroke="url(#holoStroke)" stroke-width="1.2" />
  <text x="500" y="42" text-anchor="middle" font-family="&#39;Segoe UI&#39;, sans-serif" font-weight="700" font-size="12" fill="#F0ABFC" letter-spacing="2">
    ✦ RAGHAV SHARMA ✦
  </text>

  <!-- Hero Title -->
  <text x="492" y="116" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-weight="900" font-size="66" fill="#FFFFFF" letter-spacing="1">
    Raghav
  </text>
  <text x="495" y="116" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-weight="900" font-size="66" fill="#E879F9" filter="url(#holoGlow)" letter-spacing="1">
    .dev
  </text>

  <!-- Subtitle -->
  <text x="500" y="152" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-weight="600" font-size="16" fill="#BAE6FD" letter-spacing="2.5">
    FULL STACK MERN DEVELOPER  |  CYBERSECURITY ENTHUSIAST
  </text>

  <!-- Bottom Pill -->
  <text x="500" y="194" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-weight="bold" font-size="14" fill="#F5D0FE" letter-spacing="2.5">
    BUILD  ✦  BREAK  ✦  LEARN  ✦  SECURE
  </text>
</svg>
