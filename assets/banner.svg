<svg width="1000" height="230" viewBox="0 0 1000 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Cyber Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090518" />
      <stop offset="50%" stop-color="#1E0B3B" />
      <stop offset="100%" stop-color="#071E2E" />
    </linearGradient>

    <!-- Neon Border Gradient (Magenta -> Violet -> Cyan) -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF0080" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#00F7FF" />
    </linearGradient>

    <!-- Neon Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Pink Glow Filter -->
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Cyber Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F7FF" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Main Card Base -->
  <rect x="4" y="4" width="992" height="222" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />
  <rect x="4" y="4" width="992" height="222" rx="18" fill="url(#grid)" />

  <!-- Ambient Neon Orbs -->
  <circle cx="140" cy="40" r="110" fill="#FF0080" fill-opacity="0.12" />
  <circle cx="860" cy="190" r="130" fill="#00F7FF" fill-opacity="0.12" />

  <!-- Top Terminal Pill: > whoami -->
  <rect x="420" y="24" width="160" height="28" rx="14" fill="#13092B" stroke="#A855F7" stroke-width="1.5" />
  <text x="500" y="43" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-weight="bold" font-size="14" fill="#00F7FF">
    > whoami
  </text>

  <!-- Hero Title: White "Raghav" + Glowing Cyan ".dev" -->
  <text x="485" y="115" text-anchor="end" font-family="&#39;Segoe UI&#39;, Impact, sans-serif" font-weight="900" font-style="italic" font-size="68" fill="#FFFFFF" letter-spacing="2">
    Raghav
  </text>
  <text x="488" y="115" text-anchor="start" font-family="&#39;Segoe UI&#39;, Impact, sans-serif" font-weight="900" font-style="italic" font-size="68" fill="#00F7FF" filter="url(#cyanGlow)" letter-spacing="2">
    .dev
  </text>

  <!-- Code Icon Box Next to Title -->
  <rect x="655" y="68" width="54" height="44" rx="10" fill="#13092B" stroke="#00F7FF" stroke-width="2" filter="url(#cyanGlow)" />
  <text x="682" y="97" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-weight="bold" font-size="22" fill="#FF0080">
    />
  </text>

  <!-- Subtitle -->
  <text x="500" y="152" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-weight="700" font-size="16" fill="#E2E8F0" letter-spacing="3">
    FULL STACK DEVELOPER  |  CYBERSECURITY ENTHUSIAST
  </text>

  <!-- Bottom Neon Command Pill -->
  <rect x="270" y="172" width="460" height="34" rx="17" fill="#0B061D" stroke="url(#borderGrad)" stroke-width="1.5" />
  <text x="500" y="194" text-anchor="middle" font-family="&#39;Courier New&#39;, monospace" font-weight="bold" font-size="15" fill="#00F7FF">
    > Build   > Break   > Learn   > Secure
  </text>
</svg>
